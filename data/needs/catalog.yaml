# Каталог подприложения «Потребности».
# Правится файлом — сервер подхватывает изменения без рестарта (авто-перечитывание).
#
# Структура:
#   bases:  база -> список точек пополнения
#   groups: группа -> {название препарата: единица измерения}
#
# ВАЖНО: группа «Растворы» особая (в отчёте для аптеки идёт поточково) — НЕ переименовывать.
# Единицы — по умолчанию (амп/фл/туб), при необходимости поправить.

bases:
  Ленская: [травма, урология, НХО/СКП, Эндоскопия, ПМУ, Коронары]
  Таймырская: [экстренная, план 2 этаж, гной, малая гинекология, СКП гинекология, микрохирургия]

