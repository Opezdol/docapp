<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css?v={{ git_revision }}">
  <!-- Общая библиотека фронтенда (dc): esc, apiFetch, баннер, поле времени.
       В <head> без defer: модульные скрипты идут в конце страницы и берут dc
       сразу при запуске. -->
  <script src="/static/lib/core.js?v={{ git_revision }}"></script>
  <title>{% block title %}docapp{% endblock %}</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        docapp
        {% if git_revision %}<span class="rev-badge" title="Хэш последнего коммита">{{ git_revision }}</span>{% endif %}
      </div>
      {% if user %}
      <div class="who">
        <a class="me-link" href="/me">{{ user.short_name }}</a>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="linklike">Выйти</button>
        </form>
      </div>
      {% endif %}
    </header>

    {% if flash %}
    <div class="flash">{{ flash }}</div>
    {% endif %}

    {% if user %}
    <div class="layout">
      <nav class="apps">
        {% for item in menu %}
        <a href="{{ item.path }}" class="app-link {% if request.url.path == item.path or (item.path != '/' and request.url.path.startswith(item.path)) %}active{% endif %}">{{ item.label }}</a>
        {% endfor %}
      </nav>
    {% endif %}

    <main>
      {% block content %}{% endblock %}
    </main>

    {% if user %}
    </div>
    {% endif %}
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
