<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
  <title>{% block title %}docapp{% endblock %}</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">docapp</div>
      {% if user %}
      <div class="who">
        <a class="me-link" href="/me">{{ user.short_name }}</a>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="linklike">Выйти</button>
        </form>
      </div>
      {% endif %}
    </header>

    {% if flash %}
    <div class="flash">{{ flash }}</div>
    {% endif %}

    {% if user %}
    <div class="layout">
      <nav class="apps">
        <a href="/" class="app-link {% if request.url.path == '/' or request.url.path.startswith('/anesthesia') %}active{% endif %}">Анестезии</a>
        <a href="/orders" class="app-link {% if request.url.path == '/orders' %}active{% endif %}">Приказы</a>
      </nav>
    {% endif %}

    <main>
      {% block content %}{% endblock %}
    </main>

    {% if user %}
    </div>
    {% endif %}
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
